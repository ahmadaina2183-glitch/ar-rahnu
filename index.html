<!doctype html>
<html lang="ms-MY">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b5e" />
  <title>Ar-Rahnu Pro</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Ar-Rahnu Pro</p>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <button class="icon-btn" id="installBtn" hidden>Install</button>
    </header>

    <main>
      <section class="page active" id="page-dashboard">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="quick-grid">
          <button class="quick-card" data-nav="upload">📸<span>Upload Surat</span></button>
          <button class="quick-card" data-nav="kiraan">🧮<span>Kiraan</span></button>
          <button class="quick-card" data-nav="senarai">📋<span>Senarai</span></button>
          <button class="quick-card" id="seedBtn">✨<span>Demo Data</span></button>
        </div>
        <section class="card">
          <h2>Upah Overview</h2>
          <div id="upahOverview" class="meta-grid"></div>
        </section>
        <section class="card">
          <div class="section-title"><h2>Surat Aktif</h2><button class="link-btn" data-nav="senarai">Lihat semua</button></div>
          <div id="activeTickets" class="ticket-list"></div>
        </section>
      </section>

      <section class="page" id="page-senarai">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Cari nama / no surat / IC" />
          <select id="statusFilter"><option value="all">Semua</option><option value="active">Aktif</option><option value="warning">Amaran</option><option value="overdue">Lewat</option><option value="redeemed">Selesai</option></select>
        </div>
        <div id="ticketList" class="ticket-list"></div>
      </section>

      <section class="page" id="page-detail">
        <button class="back-btn" data-nav="senarai">← Kembali</button>
        <div id="ticketDetail"></div>
      </section>

      <section class="page" id="page-kiraan">
        <section class="card">
          <h2>Kiraan Ar-Rahnu</h2>
          <label>Pilih Surat</label>
          <select id="calcTicket"></select>
          <label>Jenis Kiraan</label>
          <select id="calcType">
            <option value="partial">Tebus Sebahagian</option>
            <option value="overlap">Overlap / Renew</option>
            <option value="full">Tebus Penuh</option>
            <option value="upah">Kiraan Upah 6/12/18 Bulan</option>
          </select>
          <div id="partialBox">
            <label>Pilih Item Untuk Tebus</label>
            <div id="calcItems" class="check-list"></div>
          </div>
          <div id="overlapBox" hidden>
            <label>Pinjaman Baru / Renewal (RM)</label>
            <input id="newLoanAmount" type="number" min="0" step="0.01" placeholder="Contoh: 3000" />
            <label>Tempoh Baru (bulan)</label>
            <input id="newTenure" type="number" min="1" step="1" value="6" />
          </div>
          <button class="primary-btn" id="runCalcBtn">Kira Sekarang</button>
          <div id="calcResult" class="result-box muted">Pilih surat dan jenis kiraan dahulu.</div>
        </section>
      </section>

      <section class="page" id="page-upload">
        <section class="card">
          <h2>Upload Surat Gadaian</h2>
          <p class="muted">MVP: preview gambar + placeholder Vision OCR. Nanti backend OpenAI Vision akan isi field automatik.</p>
          <div class="upload-zone">
            <input id="imageInput" type="file" accept="image/*" capture="environment" />
            <img id="previewImg" alt="Preview surat" hidden />
          </div>
          <button class="secondary-btn" id="ocrBtn">Jalankan Vision OCR (placeholder)</button>
        </section>

        <section class="card">
          <h2>Maklumat Surat</h2>
          <div class="form-grid">
            <label>No Surat<input id="fTicketNo" /></label>
            <label>Nama<input id="fName" /></label>
            <label>No IC<input id="fIc" /></label>
            <label>No Telefon<input id="fPhone" /></label>
            <label>Pinjaman (RM)<input id="fPrincipal" type="number" min="0" step="0.01" /></label>
            <label>Harga Emas Semasa / gram (RM)<input id="fGoldPrice" type="number" min="0" step="0.01" /></label>
            <label>Kadar Upah (%)<input id="fRate" type="number" min="0" step="0.01" value="0.75" /></label>
            <label>Mode Upah<select id="fRateMode"><option value="month">Sebulan</option><option value="year">Setahun</option></select></label>
            <label>Tarikh Mula<input id="fStartDate" type="date" /></label>
            <label>Tempoh (bulan)<input id="fTenure" type="number" min="1" value="6" /></label>
          </div>
          <h3>Senarai Item</h3>
          <div id="itemEditor"></div>
          <button class="secondary-btn" id="addItemBtn">+ Tambah Item</button>
          <button class="primary-btn" id="saveTicketBtn">💾 Simpan Surat</button>
        </section>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="dashboard">🏠<span>Home</span></button>
      <button class="nav-btn" data-nav="senarai">📋<span>Surat</span></button>
      <button class="nav-btn" data-nav="upload">📸<span>Upload</span></button>
      <button class="nav-btn" data-nav="kiraan">🧮<span>Kira</span></button>
    </nav>
  </div>
  <script src="./app.js"></script>
</body>
</html>
