<!doctype html>
<html lang="ms-MY">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b5e" />
  <title>Admin Panel — Ar-Rahnu Pro</title>
  <link rel="stylesheet" href="./styles.css?v=20260508-backbtn" />
</head>
<body data-role="admin">
  <script src="./auth-guard.js?v=20260508-backbtn"></script>
  <div class="app-shell staff-app admin-app">
    <header class="topbar">
      <button class="top-back-btn" id="adminBackBtn" type="button" aria-label="Back" hidden>←</button>
      <div>
        <p class="eyebrow">Ar-Rahnu Pro</p>
        <h1 id="adminTitle">Admin Panel</h1>
      </div>
      <button class="icon-btn" id="adminRefreshBtn">Refresh</button><button class="icon-btn" onclick="arrahnuLogout()">Logout</button>
    </header>

    <main>
      <section class="admin-panel active" id="admin-overview">
        <div class="stats-grid staff-metrics" id="adminMetrics"></div>
        <section class="card"><h2>Business Overview</h2><div id="adminValueChart" class="bar-chart"></div></section>
        <section class="card"><h2>Role Summary</h2><div id="adminRoleChart" class="bar-chart"></div></section>
      </section>

      <section class="admin-panel" id="admin-staff">
        <section class="card">
          <div class="section-title"><h2>Manage Staff</h2><button class="link-btn" id="addStaffBtn">+ Staff</button></div>
          <div id="adminStaffList" class="staff-table"></div>
        </section>
      </section>

      <section class="admin-panel" id="admin-customers">
        <section class="card">
          <h2>Manage Customer</h2>
          <input id="adminCustomerSearch" type="search" placeholder="Cari customer / IC / phone" />
          <div id="adminCustomerList" class="staff-table" style="margin-top:12px"></div>
        </section>
      </section>

      <section class="admin-panel" id="admin-settings">
        <section class="card">
          <h2>Setting Kadar & Harga</h2>
          <label>Kadar Upah Default (%)<input id="setDefaultRate" type="number" min="0" step="0.01" /></label>
          <label>Mode Upah<select id="setRateMode"><option value="month">Sebulan</option><option value="year">Setahun</option></select></label>
          <label>LTV Default<select id="setDefaultLtv"><option value="0.70">70%</option><option value="0.75">75%</option><option value="0.80">80%</option><option value="0.85">85%</option></select></label>
          <label>Harga Emas Default / gram (RM)<input id="setGoldPrice" type="number" min="0" step="0.01" /></label>
          <label class="check-item"><input id="setAutoApprove" type="checkbox" /> Auto Approve Customer</label>
          <button class="primary-btn" id="saveSettingsBtn">Save Settings</button>
        </section>
      </section>

      <section class="admin-panel" id="admin-reports">
        <section class="card"><h2>Report Admin</h2><div id="adminReport" class="meta-grid"></div></section>
        <section class="card"><h2>Status Surat</h2><div id="adminTicketChart" class="bar-chart"></div></section>
      </section>
    </main>

    <nav class="bottom-nav admin-nav">
      <button class="nav-btn admin-tab active" data-tab="overview">📊<span>Overview</span></button>
      <button class="nav-btn admin-tab" data-tab="staff">🧑‍💼<span>Staff</span></button>
      <button class="nav-btn admin-tab" data-tab="customers">👥<span>Customer</span></button>
      <button class="nav-btn admin-tab" data-tab="settings">⚙️<span>Setting</span></button>
      <button class="nav-btn admin-tab" data-tab="reports">📈<span>Report</span></button>
    </nav>
  </div>

  <dialog id="staffDialog" class="staff-dialog">
    <form method="dialog" id="staffForm">
      <h2 id="staffDialogTitle">Staff</h2>
      <input id="editStaffId" type="hidden" />
      <label>Nama<input id="editStaffName" /></label>
      <label>Email<input id="editStaffEmail" type="email" /></label>
      <label>Role<select id="editStaffRole"><option value="staff">Staff</option><option value="admin">Admin</option></select></label>
      <label>Status<select id="editStaffStatus"><option value="active">Active</option><option value="disabled">Disabled</option></select></label>
      <div class="dialog-actions">
        <button class="secondary-btn" value="cancel">Tutup</button>
        <button class="primary-btn" id="saveStaffBtn" value="default">Save</button>
      </div>
      <button class="danger-btn" id="deleteStaffBtn" value="button">Delete Staff</button>
    </form>
  </dialog>

  <script src="./admin.js?v=20260508-backbtn"></script>
</body>
</html>
