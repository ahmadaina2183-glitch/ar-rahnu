<!doctype html>
<html lang="ms-MY">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b5e" />
  <title>Login — Ar-Rahnu Pro</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell login-shell">
    <header class="topbar login-topbar">
      <div class="login-brand">
        <p class="eyebrow">Welcome to</p>
        <h1>Ar-Rahnu Pro</h1>
        <span id="loginModeTitle">Login Customer</span>
      </div>
    </header>

    <main class="login-main">
      <section class="card login-card">
        <h2 id="formTitle">Login</h2>
        <div class="role-grid">
          <button class="role-btn active" data-role="customer">👤<span>Customer</span></button>
          <button class="role-btn" data-role="staff">🧑‍💼<span>Staff</span></button>
          <button class="role-btn" data-role="admin">🛡️<span>Admin</span></button>
        </div>

        <div id="registerFields" hidden>
          <label>Nama Penuh<input id="regName" autocomplete="name" placeholder="Nama anda" /></label>
          <label>Username<input id="regUsername" autocomplete="username" placeholder="contoh: faisalmusa" /></label>
          <label>No Telefon<input id="regPhone" autocomplete="tel" placeholder="Contoh: 0123456789" /></label>
        </div>

        <div id="customerLoginFields">
          <label>Email / Username<input id="loginEmail" type="email" autocomplete="username" placeholder="email@example.com" /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" /></label>
        </div>

        <div id="pinLoginFields" hidden>
          <label>PIN Akses<input id="loginPin" type="password" inputmode="numeric" placeholder="Masukkan PIN" /></label>
        </div>

        <button class="primary-btn" id="loginBtn">Login</button>
        <button class="secondary-btn" id="toggleRegisterBtn">Register Customer</button>
        <p class="muted" id="loginHint">Customer login guna email dan password.</p>
      </section>
      <footer class="login-footer">
        <p>Created with Love by <b>FaisalMusa</b></p>
        <a href="https://www.facebook.com/share/18au1J7y9N/" target="_blank" rel="noopener">Facebook</a>
      </footer>
    </main>
  </div>
  <script src="./login.js"></script>
</body>
</html>
